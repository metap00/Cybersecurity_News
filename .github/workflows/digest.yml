name: Daily brief

on:
  schedule:
    # 04:30 UTC = 06:30 Romania in winter (EET), 07:30 in summer (EEST). Use '30 3 * * *' for 06:30 in summer.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and render the brief, send nothing, write no state'
        type: boolean
        default: true

permissions:
  contents: write

concurrency: digest

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run the brief
        env:
          # A scheduled run has no inputs, so it is never a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then python -m brief.run --dry-run; else python -m brief.run; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        run: |
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Brief state: $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Tell Telegram the run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail -o /dev/null \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=Digest pipeline failed today: $RUN_URL" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
