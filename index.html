const threatColors = {
  "ELEVATED": "#dc2626",
  "ACTIVE":   "#ea580c",
  "MODERATE": "#ca8a04",
  "QUIET":    "#16a34a"
};

const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const days   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return days[dt.getDay()] + ', ' + months[m - 1] + ' ' + d + ', ' + y;
}

const container = document.getElementById('digest-list');
digests.forEach(function(entry) {
  const color = threatColors[entry.threat] || '#6b7280';
  const label = entry.threat;
  const dateLabel = formatDate(entry.date);
  const href = 'summaries/' + entry.date + '.html';

  let countsHtml = '';
  if (entry.threat === 'QUIET') {
    countsHtml = '<span style="color:#6b7280;">No significant stories</span>';
  } else {
    countsHtml =
      (entry.critical > 0 ? '<span style="color:#dc2626;font-weight:600;">' + entry.critical + ' critical</span> · ' : '') +
      (entry.high > 0     ? '<span style="color:#ea580c;font-weight:600;">' + entry.high + ' high</span> · ' : '') +

    countsHtml = countsHtml.replace(/ · $/, '');
  }
